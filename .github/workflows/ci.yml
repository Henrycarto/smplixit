name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CORE_API_URL: http://localhost:8001
          NEXT_PUBLIC_POLY_API_URL: http://localhost:8002
          NEXT_PUBLIC_GUARD_API_URL: http://localhost:8003

  services:
    name: Service (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [core, poly, guard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # prompt_builder.py and rewriter.py are not tracked. Materialize them from
      # their reference templates so a clean checkout compiles and boots.
      - name: Bootstrap engine modules
        run: node scripts/bootstrap-engine.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: ruff check app

      - name: Import check
        working-directory: services/${{ matrix.service }}
        run: python -c "from app.main import app; print(app.title)"
        env:
          OPENAI_API_KEY: test-key
          DEEPL_API_KEY: test-key
          DATABASE_URL: postgresql+asyncpg://smplixit:smplixit@localhost:5432/smplixit

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: pytest -q
        env:
          OPENAI_API_KEY: test-key
          DEEPL_API_KEY: test-key
          DATABASE_URL: postgresql+asyncpg://smplixit:smplixit@localhost:5432/smplixit

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: services
    strategy:
      fail-fast: false
      matrix:
        service: [core, poly, guard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bootstrap engine modules
        run: node scripts/bootstrap-engine.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: smplixit-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
